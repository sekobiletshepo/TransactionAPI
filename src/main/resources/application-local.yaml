spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:transactionsapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/mock-data.sql
